<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartIMS — Import & Sales Management</title>
  <meta name="description"
    content="Advanced Smart Import and Sales Management System with real-time analytics, inventory tracking, credit management, and multi-language support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="js/api_client.js?v=6"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <script src="js/chart.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=11">
</head>

<body>
  <div class="app-container">
    <!-- Top Navigation Bar -->
    <header class="top-navbar" id="topNav">
      <div class="nav-container">
        <!-- Logo -->
        <div class="logo">
          <div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
          <div>
            <div class="logo-name">Smart<span>IMS</span></div>
            <div class="logo-sub" data-i18n="app_subtitle">Import & sales system</div>
          </div>
        </div>

        <!-- Center Nav Links -->
        <nav class="top-nav-links">
          <a href="#dashboard" class="nav-item active" data-page="dashboard" onclick="UI.navigate('dashboard'); return false;">
            <span class="nav-label" id="nav_dashboard" data-i18n="nav_dashboard">Dashboard</span>
          </a>
          <a href="#products" class="nav-item" data-page="products" onclick="UI.navigate('products'); return false;">
            <span class="nav-label" id="nav_products" data-i18n="nav_products">Products</span>
          </a>
          <a href="#categories" class="nav-item" data-page="categories" onclick="UI.navigate('categories'); return false;">
            <span class="nav-label" id="nav_categories" data-i18n="nav_categories">Categories</span>
          </a>
          <a href="#suppliers" class="nav-item" data-page="suppliers" onclick="UI.navigate('suppliers'); return false;">
            <span class="nav-label" id="nav_suppliers" data-i18n="nav_suppliers">Suppliers</span>
          </a>
          <a href="#expenses" class="nav-item" data-page="expenses" onclick="UI.navigate('expenses'); return false;">
            <span class="nav-label" id="nav_expenses" data-i18n="nav_expenses">Expenses</span>
          </a>
          <a href="#sales" class="nav-item" data-page="sales" onclick="UI.navigate('sales'); return false;">
            <span class="nav-label" id="nav_sales" data-i18n="nav_sales">Sales</span>
          </a>
          <a href="#inventory" class="nav-item" data-page="inventory" onclick="UI.navigate('inventory'); return false;">
            <span class="nav-label" id="nav_inventory" data-i18n="nav_inventory">Inventory</span>
            <span class="nav-badge" id="stockAlertBadge" style="display:none">0</span>
          </a>
          <a href="#reports" class="nav-item" data-page="reports" onclick="UI.navigate('reports'); return false;">
            <span class="nav-label" id="nav_reports" data-i18n="nav_reports">Reports</span>
          </a>
          <a href="#users" class="nav-item admin-only" data-page="users" id="navUsersBtn" onclick="UI.navigate('users'); return false;" style="display:none;">
            <span class="nav-label" id="nav_users" data-i18n="nav_users">Users</span>
          </a>
          <a href="#platform" class="nav-item platform-only" data-page="platform" id="navPlatformBtn" onclick="UI.navigate('platform'); return false;" style="display:none;">
            <span class="nav-label" id="nav_platform" data-i18n="nav_platform">SaaS Platform</span>
          </a>
          <a href="#settings" class="nav-item" data-page="settings" onclick="UI.navigate('settings'); return false;">
            <span class="nav-label" id="nav_settings" data-i18n="nav_settings">Settings</span>
          </a>
        </nav>

        <!-- Right User Profile & Language -->
        <div style="display:flex; align-items:center; gap: 16px;">
          <!-- Mobile Menu Button -->
          <button id="mobileMenuBtn" class="mobile-menu-btn" onclick="document.querySelector('.top-nav-links').classList.toggle('open')" style="background:transparent; border:none; color:var(--text-main); cursor:pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <button class="lang-btn" id="langToggleBtn" onclick="I18n.toggle()"
            style="background:rgba(139, 92, 246, 0.1); border:1px solid rgba(139, 92, 246, 0.2); color:#8b5cf6; padding:6px 12px; border-radius:10px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
            <span>عربي</span>
          </button>
          
          <div class="top-nav-user" onclick="Auth.logout()" title="Logout" style="cursor: pointer; display:flex; align-items:center; gap:10px; padding: 6px 12px; border-radius: 12px; background: rgba(225, 29, 72, 0.05); border: 1px solid rgba(225, 29, 72, 0.1);">
            <div class="user-info" style="text-align: right;">
              <div class="user-name" id="userNameSidebar" style="font-weight: 700; color: #111827;">Amine Oumar</div>
              <div class="user-role" id="userRoleSidebar" style="font-size: 0.72rem; color: #6b7280;">Company admin</div>
            </div>
            <div style="color: #e11d48; display: flex; align-items: center; justify-content: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Dynamic Page Content -->
      <div class="page-content" id="pageContent">
        <!-- Loader during transitions -->
        <div class="page-loader">
          <div class="spinner"
            style="width:36px;height:36px;border-color:rgba(124,58,237,0.2);border-top-color:var(--primary);"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Premium Confirm Dialog Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm confirm-modal-card">
      <div class="confirm-header-wrapper">
        <div class="confirm-icon" id="confirmIcon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></div>
      </div>
      <h3 class="confirm-modal-title" id="confirmTitle">Confirm Action</h3>
      <p class="confirm-modal-body" id="confirmMessage">Are you sure you want to proceed?</p>
      <div class="confirm-modal-footer">
        <button class="btn btn-secondary confirm-cancel-btn" onclick="UI.closeConfirm(false)">Cancel</button>
        <button class="btn btn-danger confirm-action-btn" id="confirmOkBtn" onclick="UI.closeConfirm(true)">Delete</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/icons.js?v=6"></script>
  <script src="js/i18n.js?v=6"></script>
  <script src="js/db.js?v=6"></script>
  <script src="js/auth.js?v=1199991"></script>
  <script src="js/dashboard.js?v=6"></script>
  <script src="js/products.js?v=6"></script>
  <script src="js/categories.js?v=6"></script>
  <script src="js/suppliers.js?v=6"></script>
  <script src="js/expenses.js?v=11"></script>
  <script src="js/sales.js?v=11"></script>
  <script src="js/inventory.js?v=11"></script>
  <script src="js/reports.js?v=11"></script>
  <script src="js/users.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>

</html>
