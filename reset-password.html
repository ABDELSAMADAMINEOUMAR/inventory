<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SmartIMS</title>
  <script src="js/api_client.js"></script>
  <script src="js/db.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>

<body class="login-page">
  <div class="login-wrapper">
    <!-- Top Brand Bar -->
    <div class="login-top-bar">
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div>
          <div class="login-logo-text">Smart<span>IMS</span></div>
          <div style="font-size:0.72rem;color:var(--text-muted);">Import & Sales System</div>
        </div>
      </div>
    </div>

    <!-- Center Form Card -->
    <div class="login-card fade-in">
      <div class="login-title">
        <h2>Create New Password</h2>
        <p>Enter your new secure password below to regain access to your account.</p>
      </div>

      <div class="login-divider"></div>

      <div class="login-error" id="resetError">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> <span id="resetErrorText">Error</span>
      </div>

      <div class="login-success" id="resetSuccess"
        style="display: none; background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 0.9rem; font-weight: 600;">
        ✓ Password reset successfully! Redirecting to login...
      </div>

      <form id="resetForm" onsubmit="handleResetConfirm(event)">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="newPassword" style="margin-bottom:8px; font-size:0.95rem; font-weight: 600; color: #111827;">New Password</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="newPassword" class="input redesign-input" placeholder="At least 6 characters" required minlength="6">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="confirmPassword" style="margin-bottom:8px; font-size:0.95rem; font-weight: 600; color: #111827;">Confirm New Password</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="confirmPassword" class="input redesign-input" placeholder="Re-enter password" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary redesign-btn" id="resetBtn">
          Set New Password
        </button>

        <div style="text-align: center; margin-top: 16px;">
          <a href="index.html" style="font-size: 0.9rem; color: #8b5cf6; text-decoration: none; font-weight: 600;">← Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script>
    async function handleResetConfirm(e) {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const err = document.getElementById('resetError');
      const errText = document.getElementById('resetErrorText');
      const successBox = document.getElementById('resetSuccess');

      err.classList.remove('show');
      successBox.style.display = 'none';

      const np = document.getElementById('newPassword').value;
      const cp = document.getElementById('confirmPassword').value;

      if (np !== cp) {
        errText.textContent = 'Passwords do not match.';
        err.classList.add('show');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const uid = params.get('uid');
      const token = params.get('token');
      const emailParam = params.get('email');

      if (!uid || !token) {
        errText.textContent = 'Invalid or missing password reset token in URL.';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating Password...';

      let serverSuccess = false;
      try {
        if (typeof ApiClient !== 'undefined' && !token.startsWith('demo_token_')) {
          const res = await fetch(`${ApiClient.BASE_URL}auth/password-reset/confirm/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid, token, new_password: np })
          });
          if (res.ok) {
            successBox.style.display = 'block';
            document.getElementById('resetForm').reset();
            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            serverSuccess = true;
          } else {
            const data = await res.json();
            errText.textContent = data.detail || 'Failed to reset password. Link may be expired.';
            err.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Set New Password';
            return;
          }
        }
      } catch (ex) {
        serverSuccess = false;
      }

      if (!serverSuccess) {
        // Local Demo / Offline DB update
        if (typeof DB !== 'undefined') {
          const newHash = await DB.hashPassword(np);
          const users = DB.getAll('users');
          let u = users.find(user => (emailParam && user.email && user.email.toLowerCase() === emailParam.toLowerCase()) || user.id == uid) || DB.getById('users', uid);
          if (u) {
            await DB.update('users', u.id, {
              password: np,
              passwordHash: newHash,
              password_hash: newHash,
              is_active: true,
              must_change_password: false
            });
          } else if (emailParam) {
            DB.insert('users', {
              name: emailParam.split('@')[0],
              email: emailParam,
              username: emailParam.split('@')[0],
              password: np,
              passwordHash: newHash,
              role: 'admin',
              is_active: true,
              must_change_password: false
            });
          }
          successBox.style.display = 'block';
          document.getElementById('resetForm').reset();
          setTimeout(() => {
            sessionStorage.clear();
            localStorage.removeItem('sims_user');
            window.location.href = 'index.html';
          }, 1500);
        } else {
          errText.textContent = 'Failed to reset password offline.';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Set New Password';
        }
      }
    }
  </script>
</body>

</html>
