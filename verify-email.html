<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Account & Set Password - SmartIMS</title>
  <script src="js/api_client.js"></script>
  <script src="js/db.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <!-- Top Brand Bar -->
    <div class="login-top-bar">
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div>
          <div class="login-logo-text">Smart<span>IMS</span></div>
          <div style="font-size:0.72rem;color:var(--text-muted);">Import & Sales System</div>
        </div>
      </div>
    </div>

    <!-- Center Form Card -->
    <div class="login-card fade-in" style="position:relative;">
      <div style="position:absolute; top:16px; right:16px;">
        <button class="lang-btn" id="langToggleBtn" onclick="I18n.toggle()"
          style="background:transparent; border:1px solid #e5e7eb; color:#4b5563; padding:6px 12px; border-radius:8px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg> <span>عربي</span></button>
      </div>

      <div class="login-title">
        <h2 data-i18n="activate_title">Activate Account</h2>
        <p data-i18n="activate_sub">Your company account has been created. Verify your email and choose your permanent password.</p>
      </div>

      <div class="login-divider"></div>

      <div class="login-error" id="verifyError">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> <span id="verifyErrorText">Error</span>
      </div>

      <div class="login-success" id="verifySuccess" style="display: none; background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 14px; border-radius: 12px; margin-bottom: 16px; font-size: 0.9rem; font-weight: 600; text-align: center;">
        <div data-i18n="activate_success_title">✓ Email verified & password set successfully!</div>
        <div style="font-size:0.8rem; font-weight:400; margin-top:4px;" data-i18n="activate_success_sub">Redirecting to sign-in screen...</div>
      </div>

      <form id="verifyForm" onsubmit="handleVerifySubmit(event)">
        <div class="form-group" id="emailDisplayGroup" style="display:none; margin-bottom: 16px;">
          <label data-i18n="activate_email" style="margin-bottom:8px; font-size:0.95rem; font-weight: 600; color: #111827;">Account Email</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <input type="text" id="verifyEmailDisplay" class="input redesign-input" disabled style="color:#8b5cf6; font-weight:700; background:#f3f4f6;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="newPassword" data-i18n="activate_create_pwd" style="margin-bottom:8px; font-size:0.95rem; font-weight: 600; color: #111827;">Create Permanent Password</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="newPassword" class="input redesign-input" placeholder="At least 6 characters" data-i18n-ph="activate_ph_min" required minlength="6">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="confirmPassword" data-i18n="activate_confirm_pwd" style="margin-bottom:8px; font-size:0.95rem; font-weight: 600; color: #111827;">Confirm Password</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="confirmPassword" class="input redesign-input" placeholder="Re-enter permanent password" data-i18n-ph="activate_ph_confirm" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary redesign-btn" id="verifyBtn" data-i18n="activate_btn">
          Verify Email & Activate Account →
        </button>

        <div style="text-align: center; margin-top: 16px;">
          <a href="index.html" style="font-size: 0.9rem; color: #8b5cf6; text-decoration: none; font-weight: 600;" data-i18n="activate_back">← Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    if (typeof I18n !== 'undefined') I18n.init();
    const params = new URLSearchParams(window.location.search);
    const emailParam = params.get('email');
    if (emailParam) {
      document.getElementById('emailDisplayGroup').style.display = 'block';
      document.getElementById('verifyEmailDisplay').value = emailParam;
    }

    async function handleVerifySubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('verifyBtn');
      const err = document.getElementById('verifyError');
      const errText = document.getElementById('verifyErrorText');
      const successBox = document.getElementById('verifySuccess');

      err.classList.remove('show');
      successBox.style.display = 'none';

      const np = document.getElementById('newPassword').value;
      const cp = document.getElementById('confirmPassword').value;

      if (np !== cp) {
        errText.textContent = I18n.t('activate_err_match');
        err.classList.add('show');
        return;
      }

      let uid = params.get('uid');
      if (uid) uid = uid.replace(/=3D/g, '').replace(/^3D/, '').trim();
      let token = params.get('token');
      if (token) token = token.replace(/=3D/g, '').replace(/^3D/, '').trim();

      if (!uid || !token) {
        errText.textContent = I18n.t('activate_err_link');
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = I18n.t('activate_verifying');

      let activated = false;

      // 1. Try backend API if available
      try {
        if (typeof ApiClient !== 'undefined' && ApiClient.BASE_URL && !token.startsWith('demo_')) {
          const res = await fetch(`${ApiClient.BASE_URL}auth/verify-email/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid, token, new_password: np, email: emailParam })
          });
          if (res.ok) {
            activated = true;
          }
        }
      } catch (ex) {
        console.warn('Backend verification check failed, continuing with local activation:', ex);
      }

      // 2. Always check and activate locally in DB so it works forever offline or standalone
      if (typeof DB !== 'undefined') {
        const users = DB.getAll('users');
        let u = users.find(user => 
          (emailParam && user.email && user.email.toLowerCase() === emailParam.toLowerCase()) ||
          (user.username && user.username.toLowerCase() === uid.toLowerCase()) ||
          (user.id == uid)
        );
        const newHash = await DB.hashPassword(np);
        if (u) {
          u.password = np;
          u.passwordHash = newHash;
          u.password_hash = newHash;
          u.is_active = true;
          u.must_change_password = false;
          DB.update('users', u.id, u);
          activated = true;
        } else if (emailParam || uid) {
          DB.insert('users', {
            name: uid || (emailParam ? emailParam.split('@')[0] : 'Admin'),
            username: uid || (emailParam ? emailParam.split('@')[0] : 'admin'),
            email: emailParam || uid,
            password: np,
            passwordHash: newHash,
            password_hash: newHash,
            role: 'admin',
            is_active: true,
            must_change_password: false,
            createdAt: new Date().toISOString()
          });
          activated = true;
        }
      }

      if (activated) {
        successBox.style.display = 'block';
        document.getElementById('verifyForm').reset();
        sessionStorage.clear();
        localStorage.removeItem('sims_session');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      } else {
        errText.textContent = I18n.t('activate_err_expired');
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = I18n.t('activate_btn');
      }
    }
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof I18n !== 'undefined') I18n.init();
    });
  </script>
</body>
</html>
