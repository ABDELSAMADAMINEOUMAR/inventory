<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Import & Sales Management System</title>
  <meta name="description"
    content="Professional import and sales management system for tracking products, expenses, inventory and profits.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=6">
  <style>
    /* Extra login page animations */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(124, 58, 237, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .login-features {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .login-feature {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .login-feature span {
      color: var(--accent);
    }
  </style>
</head>

<body class="login-page">
  <div class="login-wrapper">
    <!-- Top Brand Bar -->
    <div class="login-top-bar">
      <div class="login-logo">
        <div class="login-logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
        <div>
          <div class="login-logo-text">Smart<span>IMS</span></div>
          <div style="font-size:0.72rem;color:var(--text-muted);" data-i18n="app_subtitle">Import & Sales System</div>
        </div>
      </div>
      <!-- Language Toggle -->
      <button class="lang-btn" id="langToggleBtn" onclick="I18n.toggle()"
        style="background:rgba(139, 92, 246, 0.1); border:1px solid rgba(139, 92, 246, 0.2); color:#8b5cf6; padding:6px 12px; border-radius:10px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
        🌐 <span>عربي</span>
      </button>
    </div>

    <!-- Center Form Card -->
    <div class="login-card fade-in">
      <div class="login-title">
        <h2 id="loginTitleText" data-i18n="login_welcome">Welcome Back</h2>
        <p id="loginSubText" data-i18n="login_subtitle">Sign in to manage your business</p>
      </div>

      <div class="login-divider"></div>

      <!-- Sign In Section -->
      <div id="loginSection">
        <!-- Error message -->
        <div class="login-error" id="loginError">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> <span id="loginErrorText" data-i18n="login_invalid">Invalid credentials</span>
        </div>

        <!-- Form -->
        <form id="loginForm" autocomplete="off">
          <div class="form-group" style="margin-bottom:20px;">
            <label for="loginEmail" data-i18n="login_email" style="margin-bottom:8px; font-size:0.95rem; font-weight: 600; color: #111827;">Username or Email</label>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <input type="text" id="loginEmail" class="input redesign-input" placeholder="admin@business.com"
                value="" required autocomplete="off">
            </div>
          </div>

          <div class="form-group" style="margin-bottom:24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label for="loginPassword" data-i18n="login_password" style="margin-bottom: 0; font-size:0.95rem; font-weight: 600; color: #111827;">Password</label>
              <a href="#" onclick="openForgotModal(); return false;" data-i18n="forgot_pwd_link" style="font-size: 0.9rem; color: #8b5cf6; text-decoration: none; font-weight: 600;">Forgot Password?</a>
            </div>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="loginPassword" class="input redesign-input" placeholder="Enter your password" value=""
                required autocomplete="new-password" data-i18n-ph="login_pwd_ph">
              <button type="button" class="pwd-toggle" id="pwdToggle" onclick="togglePassword('loginPassword', 'eyeIcon')">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary redesign-btn" id="loginBtn" data-i18n="login_btn">
            Sign In to Dashboard
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal modal-sm" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title" style="display: flex; align-items: center; gap: 8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span data-i18n="forgot_modal_title">Reset Your Password</span>
        </h3>
        <button type="button" class="modal-close" onclick="closeForgotModal()">&times;</button>
      </div>
      <form id="forgotForm" onsubmit="handleForgotSubmit(event)">
        <div class="modal-body" style="padding: 20px;">
          <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5;" data-i18n="forgot_modal_desc">
            Enter your registered email address and we will send you instructions to reset your password.
          </p>
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="forgotEmail" data-i18n="forgot_email_lbl" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px;">Email Address</label>
            <input type="email" id="forgotEmail" class="input" placeholder="admin@business.com" required style="width: 100%;">
          </div>
          <div id="forgotAlert" style="display: none; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 12px;"></div>
        </div>
        <div class="modal-footer" style="padding: 16px 20px; display: flex; justify-content: flex-end; gap: 10px; background: var(--bg-card); border-top: 1px solid var(--border);">
          <button type="button" class="btn btn-secondary" onclick="closeForgotModal()" data-i18n="btn_cancel" style="padding: 8px 16px; border-radius: 8px;">Cancel</button>
          <button type="submit" class="btn btn-primary" id="forgotBtn" data-i18n="forgot_send_btn" style="padding: 8px 16px; border-radius: 8px; background: #8b5cf6; color: white; font-weight: 600; border: none; cursor: pointer;">Send Reset Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/icons.js?v=99999"></script>
  <script src="js/i18n.js?v=99999"></script>
  <script src="js/api_client.js?v=99999"></script>
  <script src="js/db.js?v=99999"></script>
  <script src="js/auth.js?v=999991"></script>
  <script>
    // Initialise DB and translation layout on first load
    (async () => {
      I18n.init();
      const em = document.getElementById('loginEmail');
      const pw = document.getElementById('loginPassword');
      if (em) em.value = '';
      if (pw) pw.value = '';
      setTimeout(() => { if (em) em.value = ''; if (pw) pw.value = ''; }, 100);

      // If already logged in, redirect to app immediately
      if (Auth.isLoggedIn()) {
        window.location.href = 'app.html';
        return;
      }
      if (localStorage.getItem('sims_session_expired_notice') === '1') {
        localStorage.removeItem('sims_session_expired_notice');
        const err = document.getElementById('loginError');
        const errText = document.getElementById('loginErrorText');
        if (err && errText) {
          const title = typeof I18n !== 'undefined' ? I18n.t('session_expired_title') : 'Session Expired';
          const desc = typeof I18n !== 'undefined' ? I18n.t('session_expired_desc') : 'Your session expired after inactivity. Please sign in again.';
          errText.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><b data-i18n="session_expired_title">${title}</b><br><br><span data-i18n="session_expired_desc">${desc}</span>`;
          err.classList.add('show');
        }
      }
      await DB.seed();
    })();


    // Toggle password visibility
    function togglePassword(inputId = 'loginPassword', iconId = 'eyeIcon') {
      const pwd = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!pwd || !icon) return;
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      icon.innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      const errText = document.getElementById('loginErrorText');
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');

      const email = (emailInput ? emailInput.value : '').trim();
      const password = passwordInput ? passwordInput.value : '';

      btn.innerHTML = `<div class="spinner"></div> ${typeof I18n !== 'undefined' ? I18n.t('login_signing_in') : 'Signing in...'}`;
      btn.disabled = true;
      err.classList.remove('show');

      const wakeTimer = setTimeout(() => {
        if (btn && btn.disabled) {
          btn.innerHTML = `<div class="spinner"></div> ⏳ Waking up server (~30s)...`;
        }
      }, 2500);

      try {
        const result = await Auth.login(email, password);
        clearTimeout(wakeTimer);
        if (result.success) {
          const isMaster = result.user && (result.user.role === 'platform_owner' || result.user.email === 'abdouamine@gmail.com');
          if (!isMaster && (result.must_change_password || (result.user && result.user.must_change_password))) {
            btn.innerHTML = 'Security Requirement...';
            setTimeout(() => {
              window.location.href = `verify-email.html?uid=${result.user.id}&token=force_change&email=${encodeURIComponent(email)}`;
            }, 600);
          } else {
            btn.innerHTML = '✓ Redirecting...';
            setTimeout(() => {
              if (result.user && result.user.role === 'platform_owner') {
                window.location.href = 'app.html#platform';
              } else {
                window.location.href = 'app.html';
              }
            }, 600);
          }
        } else if (result.suspended) {
          errText.innerHTML = `<b>Company Account Suspended</b><br><br>${result.message || 'Your company account has been suspended by administration.'}`;
          err.classList.add('show');
          btn.innerHTML = I18n.t('login_btn');
          btn.disabled = false;
        } else if (result.unverified) {
          errText.innerHTML = `<b>Account Verification Required</b><br><br>An activation link was sent to your email address (<b>${result.email || email}</b>).<br>You must verify your account before logging in.`;
          err.classList.add('show');
          btn.innerHTML = I18n.t('login_btn');
          btn.disabled = false;
        } else {
          let msg = result.message || 'Error';
          if (typeof I18n !== 'undefined' && I18n.choose) {
            if (msg.includes('No account found')) {
              msg = I18n.choose('No account found with this username or email address.', 'لا يوجد حساب مطابق لاسم المستخدم أو البريد الإلكتروني.', 'Aucun compte trouvé pour ce nom d\'utilisateur ou cet e-mail.');
            } else if (msg.includes('Incorrect password')) {
              msg = I18n.choose('Incorrect password for this account.', 'كلمة المرور غير صحيحة لهذا الحساب.', 'Mot de passe incorrect pour ce compte.');
            }
          }
          errText.textContent = msg;
          err.classList.add('show');
          btn.innerHTML = I18n.t('login_btn');
          btn.disabled = false;
        }
      } catch (ex) {
        clearTimeout(wakeTimer);
        errText.textContent = 'Error';
        err.classList.add('show');
        btn.innerHTML = I18n.t('login_btn');
        btn.disabled = false;
      }
    });

    function openForgotModal() {
      document.getElementById('forgotEmail').value = document.getElementById('loginEmail').value || '';
      document.getElementById('forgotAlert').style.display = 'none';
      document.getElementById('forgotModal').classList.add('show');
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').classList.remove('show');
    }

    async function handleForgotSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      const btn = document.getElementById('forgotBtn');
      const alertBox = document.getElementById('forgotAlert');

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.color = '#ef4444';
        alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.textContent = 'Please enter a valid, recognized email address (e.g., user@gmail.com).';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      alertBox.style.display = 'none';

      try {
        if (typeof ApiClient !== 'undefined') {
          await fetch(`${ApiClient.BASE_URL}auth/password-reset/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
        }
      } catch (ex) {
        console.warn('Backend password-reset request notice:', ex.message);
      }

      alertBox.style.display = 'block';
      alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
      alertBox.style.color = '#10b981';
      alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
      alertBox.innerHTML = `✓ If an account exists with email <b>${email}</b>, a secure password reset link has been sent to your email inbox.<br><br>Please check your email inbox (or spam folder) to reset your password.`;

      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  </script>
</body>

</html>
